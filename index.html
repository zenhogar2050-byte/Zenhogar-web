    <script type="text/javascript">
      // Delayed Loading of Heavy Scripts to prioritize LCP/FCP
      function loadThirdParty() {
        // Only load if not already loaded and after user interaction or timeout
        if (window.scriptsLoaded) return;
        window.scriptsLoaded = true;

        // Google Analytics
        var ga = document.createElement('script');
        ga.async = true;
        ga.src = 'https://www.googletagmanager.com/gtag/js?id=G-57BY2PVKF4';
        document.head.appendChild(ga);
        
        window.dataLayer = window.dataLayer || [];
        function gtag(){dataLayer.push(arguments);}
        gtag('js', new Date());
        gtag('config', 'G-57BY2PVKF4');

        // Facebook Pixel
        if (!window.fbq) {
          !(function(f,b,e,v,n,t,s){if(f.fbq)return;n=f.fbq=function(){n.callMethod?
          n.callMethod.apply(n,arguments):n.queue.push(arguments)};if(!f._fbq)f._fbq=n;
          n.push=n;n.loaded=!0;n.version='2.0';n.queue=[];t=b.createElement(e);t.async=!0;
          t.src=v;s=b.getElementsByTagName(e)[0];s.parentNode.insertBefore(t,s)
          }(window,document,'script','https://connect.facebook.net/en_US/fbevents.js'));
          fbq('init', '26749410671349006');
          fbq('track', 'PageView');
        }

        // Google Merchant Badge Widget
        var mw = document.createElement('script');
        mw.id = 'merchantWidgetScript';
        mw.src = 'https://www.gstatic.com/shopping/merchant/merchantwidget.js';
        mw.defer = true;
        mw.addEventListener('load', function () {
          if (window.merchantwidget) {
            window.merchantwidget.start({
              merchant_id: 5781084661,
              position: 'BOTTOM_LEFT',
              region: 'CO'
            });
          }
        });
        document.head.appendChild(mw);
      }

      window.addEventListener('load', function() {
        setTimeout(loadThirdParty, 3500); // Priority to visual elements
      });

      // Also load on first interaction if faster
      ['mousedown', 'touchstart', 'scroll', 'keydown'].forEach(function(e) {
        window.addEventListener(e, loadThirdParty, { once: true, passive: true });
      });

      // SPA Path handling
      (function(l) {
        if (l.search[1] === '/' ) {
          var decoded = l.search.slice(1).split('&').map(function(s) { 
            return s.replace(/~and~/g, '&')
          }).join('?');
          window.history.replaceState(null, null,
            l.pathname.slice(0, -1) + decoded + l.hash
          );
        }
      }(window.location))
    </script>
